<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1380" width="190mm" height="238.36363636363637mm" role="img" aria-labelledby="accessible-title" style="font-family:Arial,sans-serif;font-size:24px;fill:#000000"><title id="accessible-title">ConstructSync Process Flow: Inter-site stock transfer</title><desc>Role-labeled business process flow. Credit payment and delivery are independent. End symbols indicate distinct milestones rather than automatic MRF closure.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#000000"/></marker></defs><rect width="100%" height="100%" fill="white"/><g data-edge="0" data-from="transferQuantities" data-to="confirmSuitability"><title>transferQuantities to confirmSuitability</title><polyline points="530,100 530,145" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="1" data-from="confirmSuitability" data-to="proposeTransfer"><title>confirmSuitability to proposeTransfer</title><polyline points="530,255 530,300" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="2" data-from="proposeTransfer" data-to="sourceRelease"><title>proposeTransfer to sourceRelease</title><polyline points="530,410 530,475" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="3" data-from="sourceRelease" data-to="resourcing"><title>Reject</title><polyline points="760,580 960,580 960,750" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="4" data-from="sourceRelease" data-to="recordRelease"><title>Approve full / part</title><polyline points="530,685 530,765" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="5" data-from="recordRelease" data-to="resourcing"><title>If any</title><polyline points="740,820 830,820" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="6" data-from="recordRelease" data-to="scheduleTransfer"><title>Released qty</title><polyline points="530,875 530,950" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="7" data-from="scheduleTransfer" data-to="dispatchTransfer"><title>scheduleTransfer to dispatchTransfer</title><polyline points="530,1050 530,1100" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="8" data-from="dispatchTransfer" data-to="transferReceiving"><title>Dispatched trip</title><polyline points="530,1210 530,1260" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-node="transferQuantities" data-kind="terminal" transform="translate(320,20)"><title>Materials allocated; for site transfer</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="420" height="80" rx="40"/></g><text x="210" y="34.959999999999994" text-anchor="middle">Materials allocated</text><text x="210" y="61.839999999999996" text-anchor="middle">for site transfer</text></g><g data-node="confirmSuitability" data-kind="activity" transform="translate(320,145)"><title>Procurement; Verify matching; descriptions &amp; units</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="420" height="110" rx="0"/></g><text x="210" y="36.519999999999996" text-anchor="middle" font-weight="bold">Procurement</text><text x="210" y="63.4" text-anchor="middle">Verify matching</text><text x="210" y="90.28" text-anchor="middle">descriptions &amp; units</text></g><g data-node="proposeTransfer" data-kind="activity" transform="translate(320,300)"><title>Procurement; Recheck availability; Request source release</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="420" height="110" rx="0"/></g><text x="210" y="36.519999999999996" text-anchor="middle" font-weight="bold">Procurement</text><text x="210" y="63.4" text-anchor="middle">Recheck availability</text><text x="210" y="90.28" text-anchor="middle">Request source release</text></g><g data-node="sourceRelease" data-kind="decision" transform="translate(300,475)"><title>Source Site; Personnel; Release decision?</title><g fill="white" stroke="#000000" stroke-width="1.8"><polygon points="230,0 460,105 230,210 0,105"/></g><text x="230" y="86.52000000000001" text-anchor="middle" font-weight="bold">Source Site</text><text x="230" y="113.4" text-anchor="middle" font-weight="bold">Personnel</text><text x="230" y="140.28" text-anchor="middle">Release decision?</text></g><g data-node="recordRelease" data-kind="activity" transform="translate(320,765)"><title>Source Site Personnel; Record released /; unreleased quantities</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="420" height="110" rx="0"/></g><text x="210" y="36.519999999999996" text-anchor="middle" font-weight="bold">Source Site Personnel</text><text x="210" y="63.4" text-anchor="middle">Record released /</text><text x="210" y="90.28" text-anchor="middle">unreleased quantities</text></g><g data-node="resourcing" data-kind="reference" transform="translate(830,750)"><title>Unreleased quantities; Return to material; sourcing</title><g fill="white" stroke="#000000" stroke-width="1.8"><polygon points="0,0 260,0 260,128 130,160 0,128"/></g><text x="130" y="32.07999999999999" text-anchor="middle">Unreleased</text><text x="130" y="58.959999999999994" text-anchor="middle">quantities</text><text x="130" y="85.84" text-anchor="middle">Return to material</text><text x="130" y="112.72" text-anchor="middle">sourcing</text></g><g data-node="scheduleTransfer" data-kind="activity" transform="translate(320,950)"><title>Logistics; Schedule transfer trip</title><g fill="white" str