rom="suitabilityDecision" data-to="proposeTransfer"><title>Yes</title><polyline points="310,800 330,800 330,545 370,545" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="6" data-from="suitabilityDecision" data-to="suitabilityResourcing"><title>No</title><polyline points="165,900 165,1040" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="7" data-from="proposeTransfer" data-to="sourceRelease"><title>proposeTransfer to sourceRelease</title><polyline points="550,600 550,700" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="8" data-from="sourceRelease" data-to="resourcing"><title>Reject</title><polyline points="760,805 960,805 960,950" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="9" data-from="sourceRelease" data-to="recordRelease"><title>Approve full / part</title><polyline points="550,910 550,970" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="10" data-from="recordRelease" data-to="resourcing"><title>If any</title><polyline points="730,1015 830,1015" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="11" data-from="recordRelease" data-to="scheduleTransfer"><title>Released qty</title><polyline points="550,1060 550,1160" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="12" data-from="scheduleTransfer" data-to="dispatchTransfer"><title>scheduleTransfer to dispatchTransfer</title><polyline points="550,1250 550,1320" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="13" data-from="dispatchTransfer" data-to="transferReceiving"><title>Dispatched t