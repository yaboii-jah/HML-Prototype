<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1180" width="190mm" height="203.8181818181818mm" role="img" aria-labelledby="accessible-title" style="font-family:Arial,sans-serif;font-size:24px;fill:#000000"><title id="accessible-title">ConstructSync Process Flow: Site stock transfer</title><desc>Role-labeled business process flow. Credit payment and delivery are independent. End symbols indicate distinct milestones rather than automatic MRF closure.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#000000"/></marker></defs><rect width="100%" height="100%" fill="white"/><g data-edge="0" data-from="transferQuantities" data-to="proposeTransfer"><title>transferQuantities to proposeTransfer</title><polyline points="550,94 550,150" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="1" data-from="proposeTransfer" data-to="sourceRelease"><title>proposeTransfer to sourceRelease</title><polyline points="550,240 550,310" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="2" data-from="sourceRelease" data-to="resourcing"><title>Reject</title><polyline points="760,415 810,415" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="3" data-from="sourceRelease" data-to="scheduleTransfer"><title>Approve full / part</title><polyline points="550,520 550,620" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="4" data-from="scheduleTransfer" data-to="dispatchTransfer"><title>scheduleTransfer to dispatchTransfer</title><polyline points="550,710 550,800" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="5" data-from="dispatchTransfer" data-to="transferReceiving"><title>Dispatched trip</title><polyline points="550,910 550,1000" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-node="transferQuantities" data-kind="terminal" transform="translate(370,30)"><title>Transfer quantities from A</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="360" height="64" rx="32"/></g><text x="180" y="40.4" text-anchor="middle">Transfer quantities from A</text></g><g data-node="proposeTransfer" data-kind="activity" transform="translate(370,150)"><title>Procurement; Propose site transfer</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="360" height="90" rx="0"/></g><text x="180" y="39.959999999999994" text-anchor="middle" font-weight="bold">Procurement</text><text x="180" y="66.84" text-anchor="middle">Propose site transfer</text></g><g data-node="sourceRelease" data-kind="decision" transform="translate(340,310)"><title>Source Site; Personnel; Release decision?</title><g fill="white" stroke="#000000" stroke-width="1.8"><polygon points="210,0 420,105 210,210 0,105"/></g><text x="210" y="86.52000000000001" text-anchor="middle" font-weight="bold">Source Site</text><text x="210" y="113.4" text-anchor="middle" font-weight="bold">Personnel</text><text x="210" y="140.28" text-anchor="middle">Release decision?</text></g><g data-node="resourcing" data-kind="reference" transform="translate(810,365)"><title>Unreleased quantities; Return to sourcing in A</title><g fill="white" stroke="#000000" stroke-width="1.8"><polygon points="0,0 280,0 280,112 140,140 0,112"/></g><text x="140" y="37.519999999999996" text-anchor="middle">Unreleased quantities</text><text x="140" y="64.4" text-anchor="middle">Return to sourcing in</text><text x="140" y="91.28" text-anchor="middle">A</text></g><g data-node="scheduleTransfer" data-kind="activity" transform="translate(370,620)"><title>Logistics; Schedule transfer trip</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="360" height="90" rx="0"/></g><text x="180" y="39.959999999999994" text-anchor="middle" font-weight="bold">Logistics</text><text x="180" y="66.84" text-anchor="middle">Schedule transfer trip</text></g><g data-node="dispatchTransfer" data-kind="activity" transform="translate(370,800)"><title>Logistics; Dispatch &amp; deduct; source stock</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="360" height="110" rx="0"/></g><text x="180" y="36.519999999999996" text-anchor="middle" font-weight="bold">Logistics</text><text x="180" y="63.4" text-anchor="middle">Dispatch &amp; deduct</text><text x="180" y="90.28" text-anchor="middle">source stock</text></g><g data-node="transferReceiving" data-kind="reference" transform="translate(370,1000)"><title>Destination receiving; &amp; records in D</title><g fill="white" stroke="#000000" stroke-width="1.8"><polygon points="0,0 360,0 360,80 180,100 0,80"/></g><text x="180" y="34.959999999999994" text-anchor="middle">Destination receiving</text><text x="180" y="61.839999999999996" text-anchor="middle">&amp; records in D</text></g><g data-label="2"><rect x="797" y="313.56" width="96" height="32.88" rx="2" fill="white"/><text x="845" y="338.4" text-anchor="middle">Reject</text></g><g data-label="3"><rect x="597" y="548.56" width="246" height="32.88" rx="2" fill="white"/><text x="720" y="573.4" text-anchor="middle">Approve full / part</text></g><g data-label="5"><rect x="582" y="933.56" width="236" height="32.88" rx="2" fill="white"/><text x="700" y="958.4" text-anchor="middle">Dispatched trip</text></g></svg>