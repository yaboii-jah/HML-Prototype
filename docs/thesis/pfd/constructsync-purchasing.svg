<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1440" width="190mm" height="248.72727272727272mm" role="img" aria-labelledby="accessible-title" style="font-family:Arial,sans-serif;font-size:24px;fill:#000000"><title id="accessible-title">ConstructSync Process Flow: Supplier purchasing and PO approval</title><desc>Role-labeled business process flow. Credit payment and delivery are independent. End symbols indicate distinct milestones rather than automatic MRF closure.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#000000"/></marker></defs><rect width="100%" height="100%" fill="white"/><g data-edge="0" data-from="purchaseQuantities" data-to="quotations"><title>purchaseQuantities to quotations</title><polyline points="550,100 550,130" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="1" data-from="quotations" data-to="draftPo"><title>quotations to draftPo</title><polyline points="550,230 550,290" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="2" data-from="draftPo" data-to="reviewPo"><title>draftPo to reviewPo</title><polyline points="550,380 550,450" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="3" data-from="reviewPo" data-to="poDecision"><title>reviewPo to poDecision</title><polyline points="550,550 550,650" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="4" data-from="reviewPo" data-to="reviewPo"><title>Hold</title><polyline points="730,500 790,500 790,420 700,420 700,450" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="5" data-from="poDecision" data-to="draftPo"><title>Return</title><polyline points="340,735 240,735 240,335 370,335" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="6" data-from="poDecision" data-to="poRejected"><title>Reject</title><polyline points="760,735 830,735" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="7" data-from="poDecision" data-to="approvePo"><title>Approve</title><polyline points="550,820 550,920" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="8" data-from="approvePo" data-to="issuePo"><title>approvePo to issuePo</title><polyline points="550,1020 550,1100" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="9" data-from="issuePo" data-to="paymentHandling"><title>issuePo to paymentHandling</title><polyline points="550,1190 550,1290" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-node="purchaseQuantities" data-kind="terminal" transform="translate(370,20)"><title>Materials allocated; for purchase</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="360" height="80" rx="40"/></g><text x="180" y="34.959999999999994" text-anchor="middle">Materials allocated</text><text x="180" y="61.839999999999996" text-anchor="middle">for purchase</text></g><g data-node="quotations" data-kind="activity" transform="translate(370,130)"><title>Procurement; Review offers; Select suppliers</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="360" height="100" rx="0"/></g><text x="180" y="31.519999999999996" text-anchor="middle" font-weight="bold">Procurement</text><text x="180" y="58.4" text-anchor="middle">Review offers</text><text x="180" y="85.28" text-anchor="middle">Select suppliers</text></g><g data-node="draftPo" data-kind="activity" transform="translate(370,290)"><title>Procureme