ate(1190,1040)"><title>Site receipts; Proceed to; receipt review</title><g fill="white" stroke="#000000" stroke-width="1.8"><polygon points="0,0 320,0 320,104 160,130 0,104"/></g><text x="160" y="31.979999999999997" text-anchor="middle">Site receipts</text><text x="160" y="61.1" text-anchor="middle">Proceed to</text><text x="160" y="90.22" text-anchor="middle">receipt review</text></g><g data-node="inventoryPosted" data-kind="terminal" transform="translate(600,1230)"><title>Site stock updated</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="320" height="60" rx="30"/></g><text x="160" y="39.1" text-anchor="middle">Site stock updated</text></g><g data-node="transferShortage" data-kind="decision" transform="translate(1540,820)"><title>Transfer qty missing?</title><g fill="white" stroke="#000000" stroke-width="1.8"><polygon points="170,0 340,90 170,180 0,90"/></g><text x="170" y="84.53999999999999" text-anchor="middle">Transfer qty</text><text x="170" y="113.66" text-anchor="middle">missing?</text></g><g data-node="noResourcing" data-kind="terminal" transform="translate(1550,650)"><title>No resourcing needed</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="320" height="60" rx="30"/></g><text x="160" y="39.1" text-anchor="middle">No resourcing needed</text></g><g data-node="shortageResourcing" data-kind="reference" transform="translate(1540,1100)"><title>Missing transfer quantities; Return to material; sourcing</title><g fill="white" stroke="#000000" stroke-width="1.8"><polygon points="0,0 340,0 340,120 170,150 0,120"/></g><text x="170" y="25.419999999999995" text-anchor="middle">Missing transfer</text><text x="170" y="54.54" text-anchor="middle">quantities</text><text x="170" y="83.66" text-anchor="middle">Return to material</text><text x="170" y="112.78" text-anchor="middle">sourcing</text></g><g data-label="2"><rect x="497" y="392.44" width="206" height="35.120000000000005" rx="2" fill="white"/><text x="600" y="419.1" text