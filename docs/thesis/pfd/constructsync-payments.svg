ed" data-to="upfrontFinance"><title>No / resolve</title><polyline points="280,905 215,905 215,500 295,500" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="6" data-from="fullPaymentVerified" data-to="upfrontClearance"><title>Yes</title><polyline points="430,985 430,1090" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="7" data-from="upfrontClearance" data-to="upfrontDelivery"><title>upfrontClearance to upfrontDelivery</title><polyline points="430,1190 430,1220" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="8" data-from="creditPaths" data-to="creditClearance"><title>Delivery</title><polyline points="1260,440 1105,440 1105,640" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="9" data-from="creditPaths" data-to="creditFinance"><title>Payment</title><polyline points="1380,440 1575,440 1575,640" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="10" data-from="creditClearance" data-to="creditDelivery"><title>creditClearance to creditDelivery</title><polyline points="1105,740 1105,870" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="11" data-from="creditFinance" data-to="creditVerify"><title>creditFinance to creditVerify</title><polyline points="1575,740 1575,840" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="12" data-from="creditVerify" data-to="balanceSettled"><title>creditVerify to balanceSettled</title><polyline points="1575,940 1575,970 1570,970 1570,1020" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="13" data-from="balanceSettled" d