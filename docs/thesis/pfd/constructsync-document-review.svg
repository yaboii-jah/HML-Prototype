<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1120" width="190mm" height="193.45454545454544mm" role="img" aria-labelledby="accessible-title" style="font-family:Arial,sans-serif;font-size:24px;fill:#000000"><title id="accessible-title">ConstructSync Process Flow: Receipt documentation and review</title><desc>Role-labeled business process flow. Credit payment and delivery are independent. End symbols indicate distinct milestones rather than automatic MRF closure.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#000000"/></marker></defs><rect width="100%" height="100%" fill="white"/><g data-edge="0" data-from="receiptEvidence" data-to="archiveReceipts"><title>receiptEvidence to archiveReceipts</title><polyline points="550,120 550,190" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="1" data-from="archiveReceipts" data-to="reviewDocuments"><title>archiveReceipts to reviewDocuments</title><polyline points="550,290 550,400" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="2" data-from="reviewDocuments" data-to="evidenceAccepted"><title>reviewDocuments to evidenceAccepted</title><polyline points="550,510 550,620" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="3" data-from="evidenceAccepted" data-to="completeEvidence"><title>No</title><polyline points="340,710 300,710" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="4" data-from="completeEvidence" data-to="archiveReceipts"><title>completeEvidence to archiveReceipts</title><polyline points="165,640 165,240 370,240" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-edge="5" data-from="evidenceAccepted" data-to="documentsReviewed"><title>Yes</title><polyline points="550,800 550,1000" stroke="#000000" stroke-width="1.8" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/></g><g data-node="receiptEvidence" data-kind="terminal" transform="translate(370,30)"><title>Warehouse or site; receipt evidence available</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="360" height="90" rx="45"/></g><text x="180" y="39.959999999999994" text-anchor="middle">Warehouse or site</text><text x="180" y="66.84" text-anchor="middle">receipt evidence available</text></g><g data-node="archiveReceipts" data-kind="activity" transform="translate(370,190)"><title>Receiving teams; Archive generated; and signed receipts</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="360" height="100" rx="0"/></g><text x="180" y="31.519999999999996" text-anchor="middle" font-weight="bold">Receiving teams</text><text x="180" y="58.4" text-anchor="middle">Archive generated</text><text x="180" y="85.28" text-anchor="middle">and signed receipts</text></g><g data-node="reviewDocuments" data-kind="activity" transform="translate(370,400)"><title>Accounting; Review required evidence</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="360" height="110" rx="0"/></g><text x="180" y="49.96" text-anchor="middle" font-weight="bold">Accounting</text><text x="180" y="76.84" text-anchor="middle">Review required evidence</text></g><g data-node="evidenceAccepted" data-kind="decision" transform="translate(340,620)"><title>Evidence complete; and acceptable?</title><g fill="white" stroke="#000000" stroke-width="1.8"><polygon points="210,0 420,90 210,180 0,90"/></g><text x="210" y="84.96000000000001" text-anchor="middle">Evidence complete</text><text x="210" y="111.84" text-anchor="middle">and acceptable?</text></g><g data-node="completeEvidence" data-kind="activity" transform="translate(30,640)"><title>Receiving teams; Complete or correct; receipt evidence</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="270" height="130" rx="0"/></g><text x="135" y="46.519999999999996" text-anchor="middle" font-weight="bold">Receiving teams</text><text x="135" y="73.4" text-anchor="middle">Complete or correct</text><text x="135" y="100.28" text-anchor="middle">receipt evidence</text></g><g data-node="documentsReviewed" data-kind="terminal" transform="translate(370,1000)"><title>Documents reviewed</title><g fill="white" stroke="#000000" stroke-width="1.8"><rect width="360" height="60" rx="30"/></g><text x="180" y="38.4" text-anchor="middle">Documents reviewed</text></g><g data-label="3"><rect x="301" y="663.56" width="38" height="32.88" rx="2" fill="white"/><text x="320" y="688.4" text-anchor="middle">No</text></g><g data-label="5"><rect x="597" y="883.56" width="86" height="32.88" rx="2" fill="white"/><text x="640" y="908.4" text-anchor="middle">Yes</text></g></svg>