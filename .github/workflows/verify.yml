name: Verify
on:
  pull_request:
  push:
    branches: [main, staging, 'feat/step-3-sessions']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24.22.1', '26.12.1']
    env:
      GOOGLE_DRIVE_ENABLED: 'false'
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the declared npm version
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify
      - run: npm run verify:browser
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-${{ matrix.os }}-node-${{ matrix.node }}
          path: .verification/
          include-hidden-files: true
          retention-days: 7
