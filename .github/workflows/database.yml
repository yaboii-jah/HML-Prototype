name: Database foundation
on:
  pull_request:
  push:
    branches: [main, staging, 'feat/step-3-hosted-foundation', 'feat/step-3-sessions', 'feat/step-3-accounts', 'feat/step-3-projects', 'feat/step-3-realtime', 'feat/step-3-acceptance', 'feat/step-4-mrf-drafts', 'feat/step-4-mrf-documents', 'feat/step-4-mrf-review', 'feat/step-4-suppliers', 'feat/step-4-quotation-drafts', 'feat/step-4-quotation-finalization', 'feat/step-4-demand-allocation', 'feat/step-4-stock-foundation', 'feat/step-4-awards-po-drafts', 'feat/step-4-accounting-commitments']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    name: Disposable Supabase (Ubuntu, Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install declared npm
        run: npm install --global npm@11.20.0
      - run: npm ci
      - run: node scripts/check-browser-startup.mjs
      - run: npm run verify:db
      - run: npm run verify:foundation -- database
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: database-foundation
          path: |
            .verification/database-ci.json
            .verification/database.types.ts
            .verification/auth-foundation.json
            .verification/auth-build.log
            .verification/auth-server.log
            .verification/browser-startup.json
            .verification/foundation-acceptance.json
            .verification/foundation-shell-*.png
            .verification/request-*.png
            .verification/supplier-*.png
            .verification/quotation-*.png
            .verification/purchasing-*.png
            .verification/purchasing-*.pdf
            .verification/accounting-*.png
            .verification/accounting-*.pdf
            .verification/purchasing-*.xlsx
          include-hidden-files: true
          retention-days: 7
