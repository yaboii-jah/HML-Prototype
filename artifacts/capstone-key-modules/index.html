<header><h1>ConstructSync — Key Module Screenshots</h1><p>16 curated figures covering 12 modules and four supporting features, using the MRF 372 sample pack. Click an image to inspect its full-resolution PNG.</p><nav><a href="capstone-key-modules.zip">Download collection ZIP</a><a href="FIGURE_CAPTIONS.csv">Captions and descriptions</a><a href="FIGURE_INDEX.md">Figure index</a><a href="README.md">Data and testing notes</a></nav><label>Show <select id="coverage"><option value="all">All 16 figures</option><option value="primary">12 primary module figures</option><option value="supporting">4 supporting feature figures</option></select></label></header><main><figure data-coverage="primary"><a href="screenshots/01-operational-dashboard-and-outstanding-department-tasks.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/01-operational-dashboard-and-outstanding-department-tasks.png" alt="Operational dashboard and outstanding department tasks"></a><figcaption><small>Dashboard · Procurement · primary</small><h2>Figure 1. Operational dashboard and outstanding department tasks</h2><p>The dashboard brings together operational counts, department actions and project budget positions. This stage includes an approved PO awaiting Procurement issuance.</p><a href="screenshots/01-operational-dashboard-and-outstanding-department-tasks.png" download>Download full-resolution PNG</a></figcaption></figure><figure data-coverage="primary"><a href="screenshots/02-project-budget-and-scope-allocation.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/02-project-budget-and-scope-allocation.png" alt="Project budget and scope allocation"></a><figcaption><small>Projects · Project Manager · primary</small><h2>Figure 2. Project budget and scope allocation</h2><p>Project details show the overall allocation, commitments, spending and available funds, with an Architectural scope linked to MRF 372.</p><a href="screenshots/02-project-budget-and-scope-allocation.png" download>Download full-resolution PNG</a></figcaption></figure><figure data-coverage="primary"><a href="screenshots/03-material-request-quantities-and-approval-controls.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/03-material-request-quantities-and-approval-controls.png" alt="Material request quantities and approval controls"></a><figcaption><small>Material requests · Project Manager · primary</small><h2>Figure 3. Material request quantities and approval controls</h2><p>The Project Manager checks eight requested materials, quantities, required dates, delivery locations and site stock before approving, returning or rejecting the request. The same record retains the source reference and supporting MRF, key plan and scope PDF.</p><a href="screenshots/03-material-request-quantities-and-approval-controls.png" download>Download full-resolution PNG</a></figcaption></figure><figure data-coverage="primary"><a href="screenshots/04-approved-purchase-order-and-supplier-issuance-controls.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/04-approved-purchase-order-and-supplier-issuance-controls.png" alt="Approved purchase order and supplier issuance controls"></a><figcaption><small>Purchase orders · Procurement · primary</small><h2>Figure 4. Approved purchase order and supplier issuance controls</h2><p>Procurement confirms issuance of an Accounting-approved and archived purchase order. The selected PO covers seven requested materials from Kestrel.</p><a href="screenshots/04-approved-purchase-order-and-supplier-issuance-controls.png" download>Download full-resolution PNG</a></figcaption></figure><figure data-coverage="primary"><a href="screenshots/05-supplier-directory-populated-from-reviewed-quotations.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/05-supplier-directory-populated-from-reviewed-quotations.png" alt="Supplier directory populated from reviewed quotations"></a><figcaption><small>Suppliers · Procurement · primary</small><h2>Figure 5. Supplier directory populated from reviewed quotations</h2><p>The supplier directory contains Meridian, Apex, Summit and Kestrel from the four reviewed sample quotations, with access to quotation history.</p><a href="screenshots/05-supplier-directory-populated-from-reviewed-quotations.png" download>Download full-resolution PNG</a></figcaption></figure><figure data-coverage="primary"><a href="screenshots/06-purchase-order-costing-and-budget-approval.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/06-purchase-order-costing-and-budget-approval.png" alt="Purchase order costing and budget approval"></a><figcaption><small>Accounting · Accounting · primary</small><h2>Figure 6. Purchase order costing and budget approval</h2><p>Accounting checks the supplier material costs, net payable and available project and Architectural scope funds before approving the Apex credit PO. Withholding reduces the supplier payable from the VAT-inclusive material total.</p><a href="screenshots/06-purchase-order-costing-and-budget-approval.png" download>Download full-resolution PNG</a></figcaption></figure><figure data-coverage="primary"><a href="screenshots/07-external-supplier-payment-coordination.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/07-external-supplier-payment-coordination.png" alt="External supplier payment coordination"></a><figcaption><small>Finance · Finance · primary</small><h2>Figure 7. External supplier payment coordination</h2><p>Finance coordinates an external supplier payment using priority, processing status, planned payment date and notes. Scheduled coordination does not establish verified payment.</p><a href="screenshots/07-external-supplier-payment-coordination.png" download>Download full-resolution PNG</a></figcaption></figure><figure data-coverage="primary"><a href="screenshots/08-site-receiving-and-accepted-delivery-quantities.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/08-site-receiving-and-accepted-delivery-quantities.png" alt="Site receiving and accepted delivery quantities"></a><figcaption><small>Deliveries · Site Personnel · primary</small><h2>Figure 8. Site receiving and accepted delivery quantities</h2><p>Site Personnel confirms received quantities against a dispatched supplier delivery and records any shortage or damage before a separate stock-posting step.</p><a href="screenshots/08-site-receiving-and-accepted-delivery-quantities.png" download>Download full-resolution PNG</a></figcaption></figure><figure data-coverage="primary"><a href="screenshots/09-inter-project-stock-transfer-and-delivery-trip.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/09-inter-project-stock-transfer-and-delivery-trip.png" alt="Inter-project stock transfer and delivery trip"></a><figcaption><small>Stock transfers · Logistics · primary</small><h2>Figure 9. Inter-project stock transfer and delivery trip</h2><p>A source-approved transfer moves four matching glass clamps from Cavite to Marina Skyline. Logistics records dispatch separately from destination receiving and posting.</p><a href="screenshots/09-inter-project-stock-transfer-and-delivery-trip.png" download>Download full-resolution PNG</a></figcaption></figure><figure data-coverage="primary"><a href="screenshots/10-project-stock-after-receipts-transfers-and-usage.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/10-project-stock-after-receipts-transfers-and-usage.png" alt="Project stock after receipts transfers and usage"></a><figcaption><small>Inventory · Site Personnel · primary</small><h2>Figure 10. Project stock after receipts transfers and usage</h2><p>The stock register shows the destination project’s posted supplier and transfer receipts after usage. Its 60 clamps combine 56 purchased pieces and four transferred pieces.</p><a href="screenshots/10-project-stock-after-receipts-transfers-and-usage.png" download>Download full-resolution PNG</a></figcaption></figure><figure data-coverage="primary"><a href="screenshots/11-management-purchasing-budget-and-workflow-report.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/11-management-purchasing-budget-and-workflow-report.png" alt="Management purchasing budget and workflow report"></a><figcaption><small>Reports · Project Manager · primary</small><h2>Figure 11. Management purchasing budget and workflow report</h2><p>Management reports consolidate project funding, purchasing volume, workflow status and exceptions for the connected MRF 372 transactions.</p><a href="screenshots/11-management-purchasing-budget-and-workflow-report.png" download>Download full-resolution PNG</a></figcaption></figure><figure data-coverage="primary"><a href="screenshots/12-department-users-and-site-project-assignments.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/12-department-users-and-site-project-assignments.png" alt="Department users and site project assignments"></a><figcaption><small>Administration · Administrator · primary</small><h2>Figure 12. Department users and site project assignments</h2><p>Administrator manages named department accounts and assigns Site Personnel to projects. The example shows the destination and source projects assigned to the site account.</p><a href="screenshots/12-department-users-and-site-project-assignments.png" download>Download full-resolution PNG</a></figcaption></figure><figure data-coverage="supporting"><a href="screenshots/13-supplier-quotation-review-beside-the-original-pdf.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/13-supplier-quotation-review-beside-the-original-pdf.png" alt="Supplier quotation review beside the original PDF"></a><figcaption><small>Material requests · Procurement · supporting</small><h2>Figure 13. Supplier quotation review beside the original PDF</h2><p>Procurement checks Kestrel’s original quotation alongside the offered-material worksheet, confirming material links, quantities and prices before finalization.</p><a href="screenshots/13-supplier-quotation-review-beside-the-original-pdf.png" download>Download full-resolution PNG</a></figcaption></figure><figure data-coverage="supporting"><a href="screenshots/14-comparative-bidding-and-saved-supplier-awards.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/14-comparative-bidding-and-saved-supplier-awards.png" alt="Comparative bidding and saved supplier awards"></a><figcaption><small>Material requests · Procurement · supporting</small><h2>Figure 14. Comparative bidding and saved supplier awards</h2><p>Four supplier quotations support the comparison. The native horizontally scrolling table is positioned to show the winning Kestrel prices and saved awards. Apex supplies 56 clamps, Kestrel supplies the other seven materials, and four clamps come from site stock.</p><a href="screenshots/14-comparative-bidding-and-saved-supplier-awards.png" download>Download full-resolution PNG</a></figcaption></figure><figure data-coverage="supporting"><a href="screenshots/15-grouped-material-usage-and-recorded-responsibility.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/15-grouped-material-usage-and-recorded-responsibility.png" alt="Grouped material usage and recorded responsibility"></a><figcaption><small>Inventory · Site Personnel · supporting</small><h2>Figure 15. Grouped material usage and recorded responsibility</h2><p>One immutable usage entry records two installed glass panels and one silicone cartridge, with a shared explanation, material-specific reasons, named actor and timestamp.</p><a href="screenshots/15-grouped-material-usage-and-recorded-responsibility.png" download>Download full-resolution PNG</a></figcaption></figure><figure data-coverage="supporting"><a href="screenshots/16-material-consumption-and-closing-stock-reconciliation.png" target="_blank" rel="noopener"><img loading="lazy" width="3200" height="2000" src="screenshots/16-material-consumption-and-closing-stock-reconciliation.png" alt="Material consumption and closing stock reconciliation"></a><figcaption><small>Inventory · Site Personnel · supporting</small><h2>Figure 16. Material consumption and closing stock reconciliation</h2><p>The glass-material filter shows source and destination stock together: four clamps transferred out of the source, 60 clamps at the destination, and two panels used with 10 remaining. The report reconciles an inclusive Philippine date range.</p><a href="screenshots/16-material-consumption-and-closing-stock-reconciliation.png" download>Download full-resolution PNG</a></figcaption></figure></main><script>document.getElementById('coverage').addEventListener('change',event=>{for(const figure of document.querySelectorAll('figure'))figure.hidden=event.target.value!=='all'&&figure.dataset.coverage!==event.target.value})</script></html>
