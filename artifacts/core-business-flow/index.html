-pdf-and-material-request-submission.png" alt="Supporting PDF and Material Request Submission"></a><figcaption><span class="tag">core</span> <strong>Figure 4. Supporting PDF and Material Request Submission</strong><p>Review the attached supporting PDF before submitting the request.</p><small>Site Personnel · PCH-MRF-0007</small></figcaption></figure><figure data-priority="core"><a href="screenshots/05-project-manager-material-request-approval.png" target="_blank"><img loading="lazy" src="screenshots/05-project-manager-material-request-approval.png" alt="Project Manager Material Request Approval"></a><figcaption><span class="tag">core</span> <strong>Figure 5. Project Manager Material Request Approval</strong><p>Review the submitted quantities and approve the MRF.</p><small>Project Manager · PCH-MRF-0007 · PCH-PO-0010 · PCH-DEL-0012</small></figcaption></figure><figure data-priority="core"><a href="screenshots/06-procurement-check-of-available-site-stock.png" target="_blank"><img loading="lazy" src="screenshots/06-procurement-check-of-available-site-stock.png" alt="Procurement Check of Available Site Stock"></a><figcaption><span class="tag">core</span> <strong>Figure 6. Procurement Check of Available Site Stock</strong><p>Check existing project stock before sourcing the remaining material requirement.</p><small>Procurement · PCH-MRF-0007 · PCH-PO-0010 · PCH-DEL-0012</small></figcaption></figure><figure data-priority="core"><a href="screenshots/07-supplier-quotation-review-and-material-matching.png" target="_blank"><img loading="lazy" src="screenshots/07-supplier-quotation-review-and-material-matching.png" alt="Supplier Quotation Review and Material Matching"></a><figcaption><span class="tag">core</span> <strong>Figure 7. Supplier Quotation Review and Material Matching</strong><p>Review the supplier offer, linked requested material, quantity, price and VAT treatment.</p><small>Procurement · PCH-MRF-0007</small></figcaption></figure><figure data-priority="core"><a href="screenshots/08-comparison-of-three-supplier-quotations.png" target="_blank"><img loading="lazy" src="screenshots/08-comparison-of-three-supplier-quotations.png" alt="Comparison of Three Supplier Quotations"></a><figcaption><span class="tag">core</span> <strong>Figure 8. Comparison of Three Supplier Quotations</strong><p>Compare compliant supplier prices and lead times for the same requested material.</p><small>Procurement · PCH-MRF-0007</small></figcaption></figure><figure data-priority="supporting"><a href="screenshots/09-supplier-comparison-remaining-columns-and-award-choices.png" target="_blank"><img loading="lazy" src="screenshots/09-supplier-comparison-remaining-columns-and-award-choices.png" alt="Supplier Comparison Remaining Columns and Award Choices"></a><figcaption><span class="tag">supporting</span> <strong>Figure 9. Supplier Comparison Remaining Columns and Award Choices</strong><p>Show the remaining supplier prices and award controls beyond the first comparison view.</p><small>Procurement · PCH-MRF-0007</small></figcaption></figure><figure data-priority="supporting"><a href="screenshots/10-saved-supplier-award-and-purchase-quantity.png" target="_blank"><img loading="lazy" src="screenshots/10-saved-supplier-award-and-purchase-quantity.png" alt="Saved Supplier Award and Purchase Quantity"></a><figcaption><span class="tag">supporting</span> <strong>Figure 10. Saved Supplier Award and Purchase Quantity</strong><p>Show the saved supplier allocation before creating a purchase order.</p><small>Procurement · PCH-MRF-0007</small></figcaption></figure><figure data-priority="core"><a href="screenshots/11-purchase-order-preparation-from-awarded-quotation.png" target="_blank"><img loading="lazy" src="screenshots/11-purchase-order-preparation-from-awarded-quotation.png" alt="Purchase Order Preparation from Awarded Quotation"></a><figcaption><span class="tag">core</span> <strong>Figure 11. Purchase Order Preparation from Awarded Quotation</strong><p>Prepare the PO using the saved supplier award.</p><small>Procurement · PCH-MRF-0007 · PCH-PO-0010 · PCH-DEL-0012</small></figcaption></figure><figure data-priority="supporting"><a href="screenshots/12-accounting-review-of-purchase-order-taxes.png" target="_blank"><img loading="lazy" src="screenshots/12-accounting-review-of-purchase-order-taxes.png" alt="Accounting Review of Purchase Order Taxes"></a><figcaption><span class="tag">supporting</span> <strong>Figure 12. Accounting Review of Purchase Order Taxes</strong><p>Review VAT and withholding before approving the supplier payable.</p><small>Accounting · PCH-MRF-0007 · PCH-PO-0010 · PCH-DEL-0012</small></figcaption></figure><figure data-priority="core"><a href="screenshots/13-accounting-budget-check-and-purchase-order-approval.png" target="_blank"><img loading="lazy" src="screenshots/13-accounting-budget-check-and-purchase-order-approval.png" alt="Accounting Budget Check and Purchase Order Approval"></a><figcaption><span class="tag">core</span> <strong>Figure 13. Accounting Budget Check and Purchase Order Approval</strong><p>Check the supplier payable and available project and scope budgets before PO approval.</p><small>Accounting · PCH-MRF-0007 · PCH-PO-0010 · PCH-DEL-0012</small></figcaption></figure><figure data-priority="core"><a href="screenshots/14-approved-purchase-order-issuance-to-supplier.png" target="_blank"><img loading="lazy" src="screenshots/14-approved-purchase-order-issuance-to-supplier.png" alt="Approved Purchase Order Issuance to Supplier"></a><figcaption><span class="tag">core</span> <strong>Figure 14. Approved Purchase Order Issuance to Supplier</strong><p>Issue the approved and archived PO to the selected supplier.</p><small>Procurement · PCH-MRF-0007 · PCH-PO-0010 · PCH-DEL-0012</small></figcaption></figure><figure data-priority="core"><a href="screenshots/15-finance-coordination-of-supplier-payment.png" target="_blank"><img loading="lazy" src="screenshots/15-finance-coordination-of-supplier-payment.png" alt="Finance Coordination of Supplier Payment"></a><figcaption><span class="tag">core</span> <strong>Figure 15. Finance Coordination of Supplier Payment</strong><p>Set payment priority, status, planned date and coordination notes.</p><small>Finance · PCH-MRF-0007 · PCH-PO-0010 · PCH-DEL-0012</small></figcaption></figure><figure data-priority="core"><a href="screenshots/16-accounting-payment-proof-and-full-payment-verification.png" target="_blank"><img loading="lazy" src="screenshots/16-accounting-payment-proof-and-full-payment-verification.png" alt="Accounting Payment Proof and Full Payment Verification"></a><figcaption><span class="tag">core</span> <strong>Figure 16. Accounting Payment Proof and Full Payment Verification</strong><p>Check archived proof before verifying full net payment.</p><small>Accounting · PCH-MRF-0007 · PCH-PO-0010 · PCH-DEL-0012</small></figcaption></figure><figure data-priority="core"><a href="screenshots/17-verified-full-payment-and-delivery-clearance.png" target="_blank"><img loading="lazy" src="screenshots/17-verified-full-payment-and-delivery-clearance.png" alt="Verified Full Payment and Delivery Clearance"></a><figcaption><span class="tag">core</span> <strong>Figure 17. Verified Full Payment and Delivery Clearance</strong><p>Show full payment verification and the remaining delivery-clearance action.</p><small>Accounting · PCH-MRF-0007 · PCH-PO-0010 · PCH-DEL-0012</small></figcaption></figure><figure data-priority="core"><a href="screenshots/18-supplier-delivery-scheduling.png" target="_blank"><img loading="lazy" src="screenshots/18-supplier-delivery-scheduling.png" alt="Supplier Delivery Scheduling"></a><figcaption><span class="tag">core</span> <strong>Figure 18. Supplier Delivery Scheduling</strong><p>Schedule the supplier-to-site delivery and expected material quantity.</p><small>Logistics · PCH-MRF-0007 · PCH-PO-0010 · PCH-DEL-0012</small></figcaption></figure><figure data-priority="core"><a href="screenshots/19-scheduled-delivery-and-dispatch-action.png" target="_blank"><img loading="lazy" src="screenshots/19-scheduled-delivery-and-dispatch-action.png" alt="Scheduled Delivery and Dispatch Action"></a><figcaption><span class="tag">core</span> <strong>Figure 19. Scheduled Delivery and Dispatch Action</strong><p>Record when the scheduled shipment leaves the supplier.</p><small>Logistics · PCH-MRF-0007 · PCH-PO-0010 · PCH-DEL-0012</small></figcaption></figure><figure data-priority="core"><a href="screenshots/20-site-receiving-and-accepted-quantities.png" target="_blank"><img loading="lazy" src="screenshots/20-site-receiving-and-accepted-quantities.png" alt="Site Receiving and Accepted Quantities"></a><figcaption><span class="tag">core</span> <strong>Figure 20. Site Receiving and Accepted Quantities</strong><p>Confirm actual accepted quantities at the destination site.</p><small>Site Personnel · PCH-MRF-0007 · PCH-PO-0010 · PCH-DEL-0012</small></figcaption></figure><figure data-priority="core"><a href="screenshots/21-received-delivery-and-site-stock-posting.png" target="_blank"><img loading="lazy" src="screenshots/21-received-delivery-and-site-stock-posting.png" alt="Received Delivery and Site Stock Posting"></a><figcaption><span class="tag">core</span> <strong>Figure 21. Received Delivery and Site Stock Posting</strong><p>Post the accepted material quantity into site inventory.</p><small>Site Personnel · PCH-MRF-0007 · PCH-PO-0010 · PCH-DEL-0012</small></figcaption></figure><figure data-priority="core"><a href="screenshots/22-completed-accounting-review-of-delivery-documents.png" target="_blank"><img loading="lazy" src="screenshots/22-completed-accounting-review-of-delivery-documents.png" alt="Completed Accounting Review of Delivery Documents"></a><figcaption><span class="tag">core</span> <strong>Figure 22. Completed Accounting Review of Delivery Documents</strong><p>Review the supplier invoice and archived receiving evidence.</p><small>Accounting · PCH-MRF-0007 · PCH-PO-0010 · PCH-DEL-0012</small></figcaption></figure><figure data-priority="core"><a href="screenshots/23-site-inventory-usage-and-stock-movement-history.png" target="_blank"><img loading="lazy" src="screenshots/23-site-inventory-usage-and-stock-movement-history.png" alt="Site Inventory Usage and Stock Movement History"></a><figcaption><span class="tag">core</span> <strong>Figure 23. Site Inventory Usage and Stock Movement History</strong><p>Trace the delivery posting and subsequent material usage.</p><small>Site Personnel · PCH-MRF-0007 · PCH-PO-0010 · PCH-DEL-0012</small></figcaption></figure><figure data-priority="core"><a href="screenshots/24-credit-terms-and-agreed-payment-due-date.png" target="_blank"><img loading="lazy" src="screenshots/24-credit-terms-and-agreed-payment-due-date.png" alt="Credit Terms and Agreed Payment Due Date"></a><figcaption><span class="tag">core</span> <strong>Figure 24. Credit Terms and Agreed Payment Due Date</strong><p>Set credit terms and the agreed due date instead of upfront payment.</p><small>Accounting · PCH-MRF-0008 · PCH-PO-0011</small></figcaption></figure><figure data-priority="core"><a href="screenshots/25-credit-delivery-clearance-with-an-unpaid-balance.png" target="_blank"><img loading="lazy" src="screenshots/25-credit-delivery-clearance-with-an-unpaid-balance.png" alt="Credit Delivery Clearance with an Unpaid Balance"></a><figcaption><span class="tag">core</span> <strong>Figure 25. Credit Delivery Clearance with an Unpaid Balance</strong><p>Show that credit delivery can be cleared before settlement.</p><small>Accounting · PCH-MRF-0008 · PCH-PO-0011</small></figcaption></figure><figure data-priority="core"><a href="screenshots/26-verified-credit-installment-and-remaining-balance.png" target="_blank"><img loading="lazy" src="screenshots/26-verified-credit-installment-and-remaining-balance.png" alt="Verified Credit Installment and Remaining Balance"></a><figcaption><span class="tag">core</span> <strong>Figure 26. Verified Credit Installment and Remaining Balance</strong><p>Show a verified installment while an outstanding balance remains.</p><small>Accounting · PCH-MRF-0008 · PCH-PO-0011</small></figcaption></figure><figure data-priority="core"><a href="screenshots/27-fully-settled-credit-purchase-and-payment-history.png" target="_blank"><img loading="lazy" src="screenshots/27-fully-settled-credit-purchase-and-payment-history.png" alt="Fully Settled Credit Purchase and Payment History"></a><figcaption><span class="tag">core</span> <strong>Figure 27. Fully Settled Credit Purchase and Payment History</strong><p>Show the two verified installments and zero remaining balance.</p><small>Accounting · PCH-MRF-0008 · PCH-PO-0011</small></figcaption></figure><figure data-priority="core"><a href="screenshots/28-matching-source-stock-for-an-interproject-transfer.png" target="_blank"><img loading="lazy" src="screenshots/28-matching-source-stock-for-an-interproject-transfer.png" alt="Matching Source Stock for an Interproject Transfer"></a><figcaption><span class="tag">core</span> <strong>Figure 28. Matching Source Stock for an Interproject Transfer</strong><p>Verify the source project, matching material and ten-sheet transfer quantity before sending the release request.</p><small>Procurement · PCH-MRF-0009 · Cavite Warehouse Expansion · Pasig Community Health Center · PCH-TRF-0001</small></figcaption></figure><figure data-priority="core"><a href="screenshots/29-source-site-review-and-stock-release-approval.png" target="_blank"><img loading="lazy" src="screenshots/29-source-site-review-and-stock-release-approval.png" alt="Source Site Review and Stock Release Approval"></a><figcaption><span class="tag">core</span> <strong>Figure 29. Source Site Review and Stock Release Approval</strong><p>The source site confirms the quantity it can release.</p><small>Site Personnel · PCH-MRF-0009 · Cavite Warehouse Expansion · Pasig Community Health Center · PCH-TRF-0001</small></figcaption></figure><figure data-priority="supporting"><a href="screenshots/30-scheduling-the-approved-site-stock-transfer.png" target="_blank"><img loading="lazy" src="screenshots/30-scheduling-the-approved-site-stock-transfer.png" alt="Scheduling the Approved Site Stock Transfer"></a><figcaption><span class="tag">supporting</span> <strong>Figure 30. Scheduling the Approved Site Stock Transfer</strong><p>Schedule a transfer trip for the approved stock quantity.</p><small>Logistics · PCH-MRF-0009 · Cavite Warehouse Expansion · Pasig Community Health Center · PCH-TRF-0001</small></figcaption></figure><figure data-priority="core"><a href="screenshots/31-transfer-dispatch-and-source-stock-deduction.png" target="_blank"><img loading="lazy" src="screenshots/31-transfer-dispatch-and-source-stock-deduction.png" alt="Transfer Dispatch and Source Stock Deduction"></a><figcaption><span class="tag">core</span> <strong>Figure 31. Transfer Dispatch and Source Stock Deduction</strong><p>Dispatch the scheduled trip; source stock is deducted at this step.</p><small>Logistics · PCH-MRF-0009 · Cavite Warehouse Expansion · Pasig Community Health Center · PCH-TRF-0001</small></figcaption></figure><figure data-priority="core"><a href="screenshots/32-destination-receiving-of-transferred-materials.png" target="_blank"><img loading="lazy" src="screenshots/32-destination-receiving-of-transferred-materials.png" alt="Destination Receiving of Transferred Materials"></a><figcaption><span class="tag">core</span> <strong>Figure 32. Destination Receiving of Transferred Materials</strong><p>Confirm the material quantity accepted by the destination site.</p><small>Site Personnel · PCH-MRF-0009 · Cavite Warehouse Expansion · Pasig Community Health Center · PCH-TRF-0001</small></figcaption></figure><figure data-priority="core"><a href="screenshots/33-posting-transferred-stock-into-destination-inventory.png" target="_blank"><img loading="lazy" src="screenshots/33-posting-transferred-stock-into-destination-inventory.png" alt="Posting Transferred Stock into Destination Inventory"></a><figcaption><span class="tag">core</span> <strong>Figure 33. Posting Transferred Stock into Destination Inventory</strong><p>Post accepted stock at the destination without supplier payment.</p><small>Site Personnel · PCH-MRF-0009 · Cavite Warehouse Expansion · Pasig Community Health Center · PCH-TRF-0001</small></figcaption></figure><figure data-priority="core"><a href="screenshots/34-accounting-review-of-completed-stock-transfer-documents.png" target="_blank"><img loading="lazy" src="screenshots/34-accounting-review-of-completed-stock-transfer-documents.png" alt="Accounting Review of Completed Stock Transfer Documents"></a><figcaption><span class="tag">core</span> <strong>Figure 34. Accounting Review of Completed Stock Transfer Documents</strong><p>Verify transfer evidence without an invoice or supplier payment.</p><small>Accounting · PCH-MRF-0009 · Cavite Warehouse Expansion · Pasig Community Health Center · PCH-TRF-0001</small></figcaption></figure><figure data-priority="core"><a href="screenshots/35-management-report-of-project-purchasing-and-budgets.png" target="_blank"><img loading="lazy" src="screenshots/35-management-report-of-project-purchasing-and-budgets.png" alt="Management Report of Project Purchasing and Budgets"></a><figcaption><span class="tag">core</span> <strong>Figure 35. Management Report of Project Purchasing and Budgets</strong><p>Review the project budget and purchasing outcome.</p><small>Project Manager · Pasig Community Health Center</small></figcaption></figure><figure data-priority="supporting"><a href="screenshots/36-management-report-of-current-site-stock.png" target="_blank"><img loading="lazy" src="screenshots/36-management-report-of-current-site-stock.png" alt="Management Report of Current Site Stock"></a><figcaption><span class="tag">supporting</span> <strong>Figure 36. Management Report of Current Site Stock</strong><p>Review current stock after delivery, transfer and material usage.</p><small>Project Manager · Pasig Community Health Center</small></figcaption></figure></main><script>function filter(value){for(const figure of document.querySelectorAll('figure'))figure.hidden=value!=='all'&&figure.dataset.priority!==value}</script></html>
